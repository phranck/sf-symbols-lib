<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SF Symbols Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="ed07e2a0-b32e-42e2-8bf1-ba87f25e11e3"></script>
    <script>
      // Apply dark mode immediately to prevent flash of light theme
      if (localStorage.getItem('sf-theme') === 'dark') {
        document.documentElement.classList.add('soft-dark');
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <style>
      /* Critical dark-mode styles to prevent FOUC */
      html.soft-dark { background-color: #22272e; color: #adbac7; }
      html.soft-dark body { background-color: #22272e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
